name: CI

# Auth/social layer checks: schema, generated client, types, tests,
# and the static-site build. Runs on pushes to main and to the
# auth-db-v0.2 feature branch, and on pull requests to main.
# It never deploys and never touches the seo-geo regenerate job
# (see .github/workflows/seo-geo.yml).

on:
  push:
    branches: [main, auth-db-v0.2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholders only. prisma validate / generate never connect
      # to a database, but prisma.config.ts resolves DIRECT_URL via
      # env() and fails fast when it is unset — so the vars must
      # exist even for these offline commands. No real secret here.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/sutekka
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/sutekka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow is required even for --check: without it the sheet
      # ratio falls back to 0.667 and index.json looks stale.
      - name: Install Pillow
        run: pip install Pillow
      - name: Verify the static site still builds
        run: python3 scripts/build_sticker_index.py --check
